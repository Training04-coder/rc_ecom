name: build-and-deploy

# PR                         -> build + terraform plan  (role lecture seule, OIDC)
# push sur la branche par defaut (main OU master) -> build + destroy + plan + apply
#                               (role deploy, environnement "production")
#
# Seule variable GitHub (Settings > Secrets and variables > Actions > Variables),
# affichee par le bootstrap (terraform output github_variables) : AWS_ACCOUNT_ID.
# Valeurs forcees ici : region eu-west-1, initiales rch, domaine
# alpha-awslab26.click, sous-domaine rch (=> https://rch.alpha-awslab26.click).
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      destroy_before_apply:
        description: "Detruire la stack principale (terraform/) avant le redeploiement"
        type: boolean
        default: true

# Authentification AWS par OIDC : aucun secret d'acces IAM stocke dans GitHub.
permissions:
  id-token: write # obtenir le token OIDC
  contents: read # checkout du code
  pull-requests: write # poster le resume du plan en commentaire de PR

# Jamais deux executions Terraform en parallele sur la meme ref.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  # Valeurs forcees (doivent rester alignees avec terraform/bootstrap et terraform/backend.tf).
  AWS_REGION: eu-west-1
  # Conventions fixees par terraform/bootstrap (memes noms dans chaque compte).
  ROLE_PLAN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/rch-github-actions-plan
  ROLE_DEPLOY: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/rch-github-actions-deploy
  TF_STATE_BUCKET: rch-bricoshop-tfstate-${{ vars.AWS_ACCOUNT_ID }}
  TF_VERSION: 1.11.4
  # Variables du Terraform principal.
  TF_VAR_aws_region: eu-west-1
  TF_VAR_initials: rch
  TF_VAR_domain_name: alpha-awslab26.click
  TF_VAR_subdomain: rch

jobs:
  # ------------------------------------------------------------------ build
  build:
    name: Build (compile-check)
    runs-on: ubuntu-latest
    steps:
      - name: Verifier la configuration GitHub
        env:
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          ok=true
          [ -n "$ACCOUNT_ID" ] || { echo "::error::Variable GitHub AWS_ACCOUNT_ID manquante (voir docs/ci-cd.md)"; ok=false; }
          if [ -n "$ACCOUNT_ID" ] && ! [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID doit faire 12 chiffres (recu : '$ACCOUNT_ID')"; ok=false
          fi
          $ok

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          # Pas de `cache:` : appli zero-dependance (ni Maven ni Gradle), donc
          # aucun lockfile de dependances a mettre en cache.

      - name: Compile-check (javac App.java)
        run: |
          mkdir -p build/classes
          javac -d build/classes app/App.java
          echo "Compilation OK (pas de tests unitaires : appli single-file)."

      - name: Upload artefact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-source
          path: app/App.java
          retention-days: 7

  # ---------------------------------------------------- plan (sur les PR)
  plan:
    name: Terraform plan (PR)
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC, role plan)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ env.ROLE_PLAN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        # -lock=false : le role plan est en lecture seule, il ne peut pas poser de verrou.
        run: terraform plan -no-color -input=false -lock=false -out=tfplan
        continue-on-error: true

      - name: Commentaire de plan sur la PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          # Passe par l'env (et non par interpolation dans le script) : evite les
          # soucis d'echappement et le risque d'injection de script.
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const out = process.env.PLAN_STDOUT || '(aucune sortie)';
            const outcome = process.env.PLAN_OUTCOME;
            const max = 60000;
            const body = [
              '#### Terraform plan `' + outcome + '`',
              '<details><summary>Afficher le plan</summary>',
              '',
              '```terraform',
              out.length > max ? out.slice(0, max) + '\n... (tronque)' : out,
              '```',
              '',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- tf-plan-comment -->';
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            const finalBody = marker + '\n' + body;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: finalBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: finalBody });
            }

      - name: Echec si le plan a echoue
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ------------------------------- deploy (branche par defaut uniquement)
  deploy:
    name: Terraform destroy + apply (production)
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    # L'environnement "production" (required reviewers) protege l'apply ET
    # conditionne la confiance OIDC du role deploy (sub = ...:environment:production).
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC, role deploy)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ env.ROLE_DEPLOY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform destroy (stack principale, avant apply)
        # working-directory = terraform/ : ne touche JAMAIS au bootstrap (terraform/bootstrap, state local).
        # 1er run / state vide : "No objects need to be destroyed", code retour 0.
        # Desactivable via Run workflow > destroy_before_apply = false.
        if: github.event_name != 'workflow_dispatch' || inputs.destroy_before_apply
        run: terraform destroy -auto-approve -no-color -input=false

      - name: Terraform plan
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -no-color -input=false tfplan

      - name: URL du site
        run: |
          echo "### Site deploye : https://${TF_VAR_subdomain}.${TF_VAR_domain_name}" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTPS disponible 1 a 3 min apres l'apply (certificat Let's Encrypt)." >> "$GITHUB_STEP_SUMMARY"
